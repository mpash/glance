apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: glance

# Base configuration
resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml
  - pvc.yaml

# Common labels for production
labels:
  - pairs:
      app.kubernetes.io/environment: production

# Patches for production
patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: glance

# Use stable version
images:
  - name: glanceapp/glance
    newTag: v0.7.0
