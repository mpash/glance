apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance-helm-repo
  namespace: argocd
  labels:
    app: glance
spec:
  project: default
  
  source:
    # Using a Helm repository (once published)
    # Example: chart: glance
    # Example: repoURL: https://charts.glanceapp.io
    
    # For now, using Git repository
    repoURL: https://github.com/glanceapp/glance.git
    targetRevision: main
    path: helm/glance
    
    helm:
      releaseName: glance
      
      # Reference to a values file in the same repo
      valueFiles:
        - values.yaml
      
      # Additional values to override
      values: |
        image:
          tag: v0.7.0
  
  destination:
    server: https://kubernetes.default.svc
    namespace: glance
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
