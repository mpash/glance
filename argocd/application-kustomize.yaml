apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: glance-kustomize
  namespace: argocd
  labels:
    app: glance
    deployment-type: kustomize
spec:
  # The project the application belongs to
  project: default
  
  # Source of the application manifests
  source:
    # Repository URL - update this to your actual repository
    repoURL: https://github.com/mpash/glance.git
    # Target revision (branch, tag, or commit)
    targetRevision: copilot/create-helm-chart-for-glance
    # Path to the Kustomize base
    path: kustomize/base
  
  # Destination cluster and namespace
  destination:
    # Kubernetes cluster (use in-cluster for the same cluster where ArgoCD is installed)
    server: https://kubernetes.default.svc
    # Target namespace
    namespace: glance
  
  # Sync policy
  syncPolicy:
    # Automated sync
    automated:
      # Automatically sync when changes are detected
      prune: true
      # Automatically sync when the application is out of sync
      selfHeal: true
      # Allow empty resources to be pruned
      allowEmpty: false
    
    # Sync options
    syncOptions:
      # Create namespace if it doesn't exist
      - CreateNamespace=true
      # Respect ignore differences
      - RespectIgnoreDifferences=true
    
    # Retry policy
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
